<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><rect width="1200" height="560" rx="28" fill="#fffaf2"/><g font-family="Tahoma,Arial,sans-serif"><text x="60" y="63" fill="#258578" font-size="18" letter-spacing="2">ENGLISH FOUNDATIONS · M03</text><text x="60" y="119" fill="#233b3a" font-size="40" font-weight="bold">One or more?</text><text x="60" y="160" fill="#566e6c" font-size="23">คำนามและจำนวน</text><rect x="60" y="207" width="346" height="231" rx="19" fill="#e4f3ed"/><text x="84" y="249" fill="#49615d" font-size="16" font-weight="bold">ONE</text><text x="84" y="302" fill="#263d3a" font-size="25" font-weight="bold">a book</text><rect x="426" y="207" width="346" height="231" rx="19" fill="#fbe6df"/><text x="450" y="249" fill="#49615d" font-size="16" font-weight="bold">MORE THAN ONE</text><text x="450" y="302" fill="#263d3a" font-size="25" font-weight="bold">three books</text><rect x="792" y="207" width="346" height="231" rx="19" fill="#e8ecfb"/><text x="816" y="249" fill="#49615d" font-size="16" font-weight="bold">IRREGULAR</text><text x="816" y="302" fill="#263d3a" font-size="25" font-weight="bold">child → children</text><text x="60" y="495" fill="#425d58" font-size="20">คำนามนับได้: ดูจำนวน แล้วเลือกรูปเอกพจน์หรือพหูพจน์</text><text x="60" y="533" fill="#71847f" font-size="15">สังเกตรูป → เข้าใจความหมาย → ลองใช้ข้อมูลของคุณ</text></g></svg>